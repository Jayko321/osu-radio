name: Linux CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  qt-build:
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: '-C link-arg=-fuse-ld=lld'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install repository Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config lld libasound2-dev libclang-dev libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libfontconfig1-dev libxcb-cursor0
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtshadertools qtimageformats
          aqtversion: '==3.3.0'
      - name: Build Qt application
        run: cargo build -p osu-radio-qt --locked

  formatting:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Install repository Rust toolchain
        run: rustup toolchain install --no-self-update
      - run: cargo fmt --check

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install repository Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev libclang-dev dbus-daemon
      - name: Scanner helper build script tests
        run: python3 -B -m unittest discover -s crates/radio-scanner/tests -p 'test_*.py' -v
      - name: Benchmark script tests
        run: python3 -B -m unittest discover -s tools/search-benchmark -v
      - name: Qt verification script tests
        run: python3 -B -m unittest discover -s apps/osu-radio-qt/tests -p 'test_*.py' -v
      # radio-scanner's build.rs compiles the real .NET Realm helper.
      # Default database features select SQLite; ignored benchmarks stay skipped.
      - name: Core, scanner, SQLite backend, audio and system media tests
        run: cargo test -p radio-core -p radio-scanner -p radio-db -p radio-services -p osu-radio-cli -p osu-radio-server -p osu-radio-player -p osu-radio-media-controls --locked -- --test-threads=1
      - name: Server without API docs
        run: cargo test -p osu-radio-server --no-default-features --features sqlite --locked -- --test-threads=1
      - name: Client unit tests
        run: cargo test -p osu-radio-client --lib --locked -- --test-threads=1
      - name: Client unit tests with mocks
        run: cargo test -p osu-radio-client --features mock --lib --locked -- --test-threads=1
      - name: Isolated MPRIS protocol tests
        run: dbus-run-session -- cargo test -p osu-radio-media-controls --test linux --locked -- --ignored --test-threads=1

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install repository Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev libclang-dev
      - name: Lint headless packages (SQLite, API docs enabled)
        run: cargo clippy -p radio-core -p radio-scanner -p radio-db -p radio-services -p osu-radio-cli -p osu-radio-server -p osu-radio-player -p osu-radio-client -p osu-radio-media-controls --all-targets --locked -- -D warnings
      - name: Lint server without API docs
        run: cargo clippy -p osu-radio-server --no-default-features --features sqlite --all-targets --locked -- -D warnings
      - name: Lint client with mocks
        run: cargo clippy -p osu-radio-client --features mock --all-targets --locked -- -D warnings
