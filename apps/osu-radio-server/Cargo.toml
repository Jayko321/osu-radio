[package]
name = "osu-radio-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["sqlite", "docs"]
sqlite = ["radio-db/sqlite"]
postgres = ["radio-db/postgres"]
docs = ["dep:utoipa", "dep:utoipa-axum", "dep:utoipa-scalar"]

[dependencies]
anyhow.workspace = true
axum = { version = "0.8" }
dotenvy.workspace = true
radio-core = { path = "../../crates/radio-core/" }
radio-db = { path = "../../crates/radio-db/", default-features = false }
radio-scanner = { path = "../../crates/radio-scanner/" }
serde = { version = "1.0.228", features = ["derive"] }
tokio.workspace = true
utoipa = { version = "5.5.0", features = ["axum_extras"], optional = true }
utoipa-axum = { version = "0.2.0", optional = true }
utoipa-scalar = { version = "0.3.0", features = ["axum"], optional = true }

[dev-dependencies]
serde_json = { version = "1.0.145" }
tempfile = { version = "3" }
