[package]
name = "radio-db"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
radio-core = { path = "../radio-core/" }
sea-orm = { version = "=2.0.2", default-features = false, features = ["macros", "runtime-tokio-rustls", "with-json"] }
sea-orm-migration = { version = "=2.0.2", default-features = false, features = ["runtime-tokio-rustls"] }
serde_json = "1.0.145"
hex = "0.4"
sha2 = { version = "0.11", default-features = false }

[features]
default = ["sqlite"]
sqlite = ["sea-orm/sqlx-sqlite", "sea-orm-migration/sqlx-sqlite"]
postgres = ["sea-orm/sqlx-postgres", "sea-orm-migration/sqlx-postgres"]

[dev-dependencies]
tokio.workspace = true
tempfile = "3"
