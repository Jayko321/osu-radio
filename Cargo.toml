[workspace]
resolver = "2"
members = [
    "apps/osu-radio-cli",
    "apps/osu-radio-gui-vizia",
    "apps/osu-radio-server",
    "crates/osu-radio-client",
    "crates/radio-core",
    "crates/radio-db",
    "crates/radio-scanner",
]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = { version = "1.0.100" }
dotenvy = { version = "0.15.7" }
tokio = { version = "1.52.3", features = ["full"] }
